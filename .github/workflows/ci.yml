name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Contract & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses & install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify CI/release module coverage and AVF harness wiring
        run: |
          python3 tools/ci/test_check_ci_module_coverage.py
          python3 tools/ci/check_ci_module_coverage.py

      - name: AVF device-validation tool tests and dry-run
        run: |
          AVF_VALIDATION_TEST_ROOT="$RUNNER_TEMP/avf-validation-tests" \
            python3 -B -m unittest discover -s tools/device-validation -p 'test_avf*.py'
          python3 -B tools/device-validation/run_avf_device_validation.py \
            --dry-run --out "$RUNNER_TEMP/avf-device-validation-dry-run"

      # AX-07: the accelerator performance protocol must be executable, not just
      # documented. This runs its unit tests, the fixed-input dry-run gate, and a
      # real collect+validate round trip into a temp directory.
      - name: AX-07 accelerator performance protocol tests and dry-run
        run: |
          python3 -B -m unittest discover -s tools/accelerator-perf -p 'test_*.py'
          python3 -B tools/accelerator-perf/validate.py --self-test
          python3 -B tools/accelerator-perf/collect.py \
            --samples tools/accelerator-perf/fixtures/samples-dryrun.tsv \
            --build-id ci-dryrun --device-alias bench-sim \
            --generated-at 2026-10-23T00:00:00Z \
            --out "$RUNNER_TEMP/accelerator-perf-dryrun.json"
          python3 -B tools/accelerator-perf/validate.py \
            --report "$RUNNER_TEMP/accelerator-perf-dryrun.json"

      - name: Run provisioned launch regression gate
        run: ./gradlew :app:testDebugUnitTest --tests '*ProvisionedLaunchRegressionTest' --no-daemon --stacktrace

      - name: Run all runtime checks and app unit tests
        run: |
          bash tools/ci/run-gradle-gate.sh \
            :runtime:contract:check \
            :runtime:instance:check \
            :runtime:engine-qemu:check \
            :runtime:engine-avf:check \
            :runtime:capability:check \
            :runtime:distro:check \
            :runtime:network:check \
            :runtime:engine-fastlane:check \
            :runtime:fastlane-distcc:check \
            :runtime:fastlane-telemetry:check \
            :runtime:fastlane-capability:check \
            :runtime:fastlane-storage:check \
            :runtime:fastlane-proxy:check \
            :runtime:fastlane-terminal:check \
            :app:testDebugUnitTest

      - name: Upload Gradle gate log and failed-task summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-gate-${{ github.run_id }}
          path: |
            build/ci/gradle-gate.log
            build/ci/gradle-gate-summary.txt
          if-no-files-found: warn

  # Lightweight PR/release packaging gate. The full QEMU payload build and its
  # supply-chain checks stay in qemu-android.yml; this job only re-runs the
  # lint/assemble/16 KB checks that used to be workflow_dispatch-only.
  android-package-gate:
    name: Android lint, assemble and 16 KB packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses & install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973" || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint and assemble debug
        run: ./gradlew :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh app/build/outputs/apk/debug/app-debug.apk

  release-metadata:
    name: Release Metadata Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reject internal suffixes in release fields
        run: python3 tools/release/check_release_fields.py

      - name: Test the release gate parser
        run: python3 tools/release/test_verify_apk.py
