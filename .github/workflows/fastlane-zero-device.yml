name: Fast Lane zero-device

# Host-only gates for every Fast Lane module: the sealed toolbox, the payload,
# the shared FLN1 wire fixture, all JVM lanes and the license/SBOM surface.
# This workflow never runs adb, never starts a device, never signs or publishes
# a release artifact.
on:
  pull_request:
    paths:
      - "protocol/**"
      - "fastlane-toolbox/**"
      - "runtime/engine-fastlane/**"
      - "runtime/fastlane-terminal/**"
      - "runtime/fastlane-capability/**"
      - "runtime/fastlane-proxy/**"
      - "runtime/fastlane-storage/**"
      - "runtime/fastlane-telemetry/**"
      - "runtime/fastlane-distcc/**"
      - "tools/fastlane-build/**"
      - "tools/qemu-tuning/**"
      - "tools/ci/**"
      - "fastlane-payload/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "NOTICE-fastlane.md"
      - ".github/workflows/fastlane-zero-device.yml"
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - "fastlane-toolbox/**"
      - "runtime/engine-fastlane/**"
      - "runtime/fastlane-terminal/**"
      - "runtime/fastlane-capability/**"
      - "runtime/fastlane-proxy/**"
      - "runtime/fastlane-storage/**"
      - "runtime/fastlane-telemetry/**"
      - "runtime/fastlane-distcc/**"
      - "tools/fastlane-build/**"
      - "tools/qemu-tuning/**"
      - "tools/ci/**"
      - "fastlane-payload/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "NOTICE-fastlane.md"
      - ".github/workflows/fastlane-zero-device.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolbox-and-licenses:
    name: Toolbox, zip gates, Python lanes and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create an isolated Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml==6.0.2

      - name: Validate the zero-device workflow
        run: |
          . .venv/bin/activate
          python3 tools/fastlane-build/check_zero_device_workflow.py

      - name: Run Python gate unit tests
        run: |
          . .venv/bin/activate
          python3 -m unittest discover -s tools/fastlane-build -p 'test_*.py' -v

      - name: Run QEMU tuning matrix unit tests
        run: |
          . .venv/bin/activate
          python3 -m unittest discover -s tools/qemu-tuning -p 'test_*.py' -v

      - name: Build pinned toolbox
        run: |
          . .venv/bin/activate
          python3 tools/fastlane-build/fastlane_build.py build \
            --manifest fastlane-toolbox/manifest.json \
            --out build/fastlane-toolbox \
            --cache build/fastlane-cache

      - name: Verify toolbox layout and 16 KB ELF alignment
        run: |
          . .venv/bin/activate
          python3 tools/fastlane-build/fastlane_build.py verify-toolbox --toolbox build/fastlane-toolbox

      - name: Prove the toolbox builds twice to the same tree
        run: |
          . .venv/bin/activate
          python3 tools/fastlane-build/reproduce.py \
            --manifest fastlane-toolbox/manifest.json \
            --cache build/fastlane-cache \
            --runs 2

      - name: Prove the gates fail closed
        run: |
          . .venv/bin/activate
          python3 tools/fastlane-build/prove_gate_blocks.py

      - name: Check licenses, NOTICE and SBOM
        run: |
          . .venv/bin/activate
          python3 tools/fastlane-build/fastlane_build.py check-licenses

  jvm-distcc:
    name: Every Fast Lane JVM module
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # engine-fastlane, fastlane-terminal, fastlane-capability, fastlane-proxy,
      # fastlane-storage, fastlane-telemetry and fastlane-distcc.
      - name: Run every Fast Lane JVM test
        run: bash tools/ci/run-fastlane-zero-device.sh jvm

  payload-host:
    name: Payload host build, CTest and FLN1 E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for the E2E harness
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch pinned JUnit for the E2E harness
        run: |
          mkdir -p /tmp/fl-junit
          curl -fsSLo /tmp/fl-junit/junit-4.13.2.jar \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSLo /tmp/fl-junit/hamcrest-core-1.3.jar \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          echo "8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  /tmp/fl-junit/junit-4.13.2.jar" | sha256sum -c -
          echo "66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  /tmp/fl-junit/hamcrest-core-1.3.jar" | sha256sum -c -

      - name: Build the payload with ASan/UBSan and run CTest
        run: tools/ci/run-fastlane-zero-device.sh cpp

      - name: Run the host mux against the real payload process
        env:
          JUNIT_JAR: /tmp/fl-junit/junit-4.13.2.jar
          HAMCREST_JAR: /tmp/fl-junit/hamcrest-core-1.3.jar
          FASTLANE_PAYLOAD_BIN: ${{ github.workspace }}/build/fastlane-payload/fastlane_payload_host
        run: tools/ci/run-fastlane-zero-device.sh e2e

  apk-bin-gate:
    name: APK bin/ injection and 16 KB packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973" || true
          fi

      - name: Build toolbox
        run: |
          python3 tools/fastlane-build/fastlane_build.py build \
            --manifest fastlane-toolbox/manifest.json \
            --out build/fastlane-toolbox \
            --cache build/fastlane-cache

      - name: Assemble debug APK with bin/ packaged before signing
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:verifyFastlaneToolboxApk \
            -Porchestella.fastlane.toolboxDir=build/fastlane-toolbox \
            --no-daemon --stacktrace

      - name: Verify APK 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh app/build/outputs/apk/debug/app-debug.apk

  payload-build:
    name: Payload NDK/CMake build (P02 source required)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect P02 payload source
        id: payload
        run: |
          if [ -f fastlane-payload/CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PENDING_INTEGRATION fastlane-payload/CMakeLists.txt is absent; the real NDK payload build waits for P02"
          fi

      - name: Prove the payload build flow with a host fixture
        run: python3 tools/fastlane-build/prove_payload_fixture.py

      - name: Set up JDK 17
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake
        if: steps.payload.outputs.present == 'true'
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::NDK/CMake installation failed after 3 attempts"
              exit 1
            fi
            echo "sdkmanager failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

      - name: Pin the NDK and CMake toolchain
        if: steps.payload.outputs.present == 'true'
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ ! -d "$NDK_DIR" ]; then
            echo "::error::the pinned NDK is missing: $NDK_DIR"
            exit 1
          fi
          NDK_REVISION="$(sed -nE 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$NDK_DIR/source.properties" | head -1)"
          if [ "$NDK_REVISION" != "27.0.12077973" ]; then
            echo "::error::the pinned NDK revision is '$NDK_REVISION', expected 27.0.12077973"
            exit 1
          fi
          CMAKE_DIR="$ANDROID_HOME/cmake/3.22.1"
          if [ ! -x "$CMAKE_DIR/bin/cmake" ]; then
            echo "::error::the pinned CMake is missing: $CMAKE_DIR/bin/cmake"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "CMAKE=$CMAKE_DIR/bin/cmake" >> "$GITHUB_ENV"
          echo "$CMAKE_DIR/bin" >> "$GITHUB_PATH"

      - name: Build payload and check symbol/16 KB
        if: steps.payload.outputs.present == 'true'
        run: bash tools/fastlane-build/build-payload.sh
