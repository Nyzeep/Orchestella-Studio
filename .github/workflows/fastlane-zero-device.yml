name: Fast Lane zero-device

# Host-only gates for the sealed toolbox, the distcc byte bridge and the
# license/SBOM surface. This workflow never runs adb, never starts a device,
# never signs or publishes a release artifact.
on:
  pull_request:
    paths:
      - "fastlane-toolbox/**"
      - "runtime/engine-fastlane/**"
      - "runtime/fastlane-distcc/**"
      - "tools/fastlane-build/**"
      - "tools/ci/**"
      - "fastlane-payload/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "NOTICE-fastlane.md"
      - ".github/workflows/fastlane-zero-device.yml"
  push:
    branches: [main]
    paths:
      - "fastlane-toolbox/**"
      - "runtime/engine-fastlane/**"
      - "runtime/fastlane-distcc/**"
      - "tools/fastlane-build/**"
      - "tools/ci/**"
      - "fastlane-payload/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "NOTICE-fastlane.md"
      - ".github/workflows/fastlane-zero-device.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolbox-and-licenses:
    name: Toolbox, zip gates and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install workflow validator
        run: python3 -m pip install --user pyyaml==6.0.2

      - name: Validate the zero-device workflow
        run: python3 tools/fastlane-build/check_zero_device_workflow.py

      - name: Run Python gate unit tests
        run: python3 -m unittest discover -s tools/fastlane-build -p 'test_*.py' -v

      - name: Build pinned toolbox
        run: |
          python3 tools/fastlane-build/fastlane_build.py build \
            --manifest fastlane-toolbox/manifest.json \
            --out build/fastlane-toolbox \
            --cache build/fastlane-cache

      - name: Verify toolbox layout and 16 KB ELF alignment
        run: python3 tools/fastlane-build/fastlane_build.py verify-toolbox --toolbox build/fastlane-toolbox

      - name: Prove the toolbox builds twice to the same tree
        run: |
          python3 tools/fastlane-build/reproduce.py \
            --manifest fastlane-toolbox/manifest.json \
            --cache build/fastlane-cache \
            --runs 2

      - name: Prove the gates fail closed
        run: python3 tools/fastlane-build/prove_gate_blocks.py

      - name: Check licenses, NOTICE and SBOM
        run: python3 tools/fastlane-build/fastlane_build.py check-licenses

  jvm-distcc:
    name: Engine and distcc JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run engine-fastlane and fastlane-distcc tests
        run: bash tools/ci/run-gradle-gate.sh :runtime:engine-fastlane:test :runtime:fastlane-distcc:test

  apk-bin-gate:
    name: APK bin/ injection and 16 KB packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973" || true
          fi

      - name: Build toolbox
        run: |
          python3 tools/fastlane-build/fastlane_build.py build \
            --manifest fastlane-toolbox/manifest.json \
            --out build/fastlane-toolbox \
            --cache build/fastlane-cache

      - name: Assemble debug APK with bin/ packaged before signing
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:verifyFastlaneToolboxApk \
            -Porchestella.fastlane.toolboxDir=build/fastlane-toolbox \
            --no-daemon --stacktrace

      - name: Verify APK 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh app/build/outputs/apk/debug/app-debug.apk

  payload-build:
    name: Payload NDK/CMake build (P02 source required)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect P02 payload source
        id: payload
        run: |
          if [ -f fastlane-payload/CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PENDING_INTEGRATION fastlane-payload/CMakeLists.txt is absent; the real NDK payload build waits for P02"
          fi

      - name: Prove the payload build flow with a host fixture
        run: python3 tools/fastlane-build/prove_payload_fixture.py

      - name: Set up JDK 17
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        if: steps.payload.outputs.present == 'true'
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" || true
          fi

      - name: Build payload and check symbol/16 KB
        if: steps.payload.outputs.present == 'true'
        run: bash tools/fastlane-build/build-payload.sh
