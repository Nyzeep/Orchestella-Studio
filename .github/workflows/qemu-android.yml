# Ticket 26 QEMU Android supply-chain CI.
#
# Implements the gates required by docs/agent-handoff/QEMU_JNI_SUPPLY_CHAIN_POLICY.md
# section 5 and the full-closeout dispatch section 7.8, under the 2026-09-25
# user ruling for this file's ownership.
#
# Design rules (fail closed):
# - Build inputs are checked against tools/qemu-android/qemu-jni.lock.
#   Pinned builder/runner identifiers and approved input path names are explicit
#   here; a missing lock value fails the affected input step.
# - No third-party actions are used: the lock contains no action pins and
#   policy section 3 forbids inventing values, so five jobs fetch the triggering
#   repository commit with plain git. CI also fetches the pinned pcre2/libffi
#   GitHub release assets. The dtc/proxy-libintl git URLs in the lock document
#   historical acquisition; CI consumes their checked vendored archives.
# - The device gate fails closed (PENDING-HARDWARE). It must never be flipped
#   to skipped-as-success, substituted with an emulator, or marked passed
#   without real arm64 hardware evidence.
name: qemu-android

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  provenance-lock:
    name: Provenance and lock verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch repository
        run: |
          git clone --no-checkout --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL invalid trigger SHA"; exit 1; }
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git -C repo fetch --no-tags --depth 1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          else
            git -C repo fetch --no-tags --depth 1 origin "$TARGET_SHA"
          fi
          [[ "$(git -C repo rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL trigger SHA mismatch"; exit 1; }
          git -C repo checkout --detach "$TARGET_SHA"
          [[ "$(git -C repo rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL checkout SHA mismatch"; exit 1; }
          cd repo
          git rev-parse HEAD
      - name: Verify lock schema and completeness
        run: |
          set -euo pipefail
          cd repo
          CI_REPO="$PWD" bash tools/qemu-android/scripts/verify-native-prebuild.sh
          echo "LOCK_SCHEMA_OK"
      - name: Verify QEMU archive hash and detached signature
        run: |
          cd repo
          QURL=$(grep '^qemu_archive_url=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          QSHA=$(grep '^qemu_archive_sha256=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          QSIG=$(grep '^qemu_signature_url=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          QFP=$(grep '^qemu_signer_fingerprint=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          curl --proto '=https' --tlsv1.2 --fail --retry 0 -o qemu.tar.xz "$QURL"
          curl --proto '=https' --tlsv1.2 --fail --retry 0 -o qemu.tar.xz.sig "$QSIG"
          echo "$QSHA  qemu.tar.xz" | sha256sum --check --status || { echo "FAIL qemu sha256"; exit 1; }
          curl --proto '=https' --tlsv1.2 --fail --retry 0 "https://keys.openpgp.org/vks/v1/by-fingerprint/$QFP" | gpg --import
          gpg --batch --no-auto-key-retrieve --verify qemu.tar.xz.sig qemu.tar.xz 2> gpg.log || { echo "FAIL qemu signature"; cat gpg.log; exit 1; }
          grep -q "VALIDSIG $QFP" gpg.log || { echo "FAIL qemu signer fingerprint"; exit 1; }
          echo "QEMU_PROVENANCE_OK"
      - name: Verify NDK archive both checksums
        run: |
          cd repo
          NURL=$(grep '^android_ndk_archive_url=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          NSHA1=$(grep '^android_ndk_metadata_sha1=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          NSHA256=$(grep '^android_ndk_archive_sha256=' tools/qemu-android/qemu-jni.lock | cut -d= -f2-)
          curl --proto '=https' --tlsv1.2 --fail --retry 0 -o ndk.zip "$NURL"
          echo "$NSHA256  ndk.zip" | sha256sum --check --status || { echo "FAIL ndk sha256"; exit 1; }
          echo "$NSHA1  ndk.zip" | sha1sum --check --status || { echo "FAIL ndk sha1"; exit 1; }
          echo "NDK_PROVENANCE_OK"

  native-build-two-clean:
    name: Reproducible native build (two clean builds, identical products)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/base@sha256:3612b800eaae8513e7dca54f21d2e4eda48eda57426f3746a78677f342ac7ee9
      options: --platform linux/amd64
    timeout-minutes: 240
    steps:
      - name: Fetch repository
        run: |
          git clone --no-checkout --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /workspace
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL invalid trigger SHA"; exit 1; }
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git -C /workspace fetch --no-tags --depth 1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          else
            git -C /workspace fetch --no-tags --depth 1 origin "$TARGET_SHA"
          fi
          [[ "$(git -C /workspace rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL trigger SHA mismatch"; exit 1; }
          git -C /workspace checkout --detach "$TARGET_SHA"
          [[ "$(git -C /workspace rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL checkout SHA mismatch"; exit 1; }
          git -C /workspace rev-parse HEAD
      - name: Provision pinned inputs
        run: |
          set -euo pipefail
          CI_REPO=/workspace bash /workspace/tools/qemu-android/scripts/verify-native-prebuild.sh
          mkdir -p /inputs /ndk /io
          CI_REPO=/workspace CI_INPUT_ROOT=/inputs bash /workspace/tools/qemu-android/scripts/fetch-ci-inputs.sh
          CI_REPO=/workspace CI_INPUT_ROOT=/inputs bash /workspace/tools/qemu-android/scripts/verify-ci-inputs.sh --extract-qemu
          python3 -c "import zipfile; zipfile.ZipFile('/inputs/ndk.zip').extractall('/ndk')"
          test -d /ndk/android-ndk-r28c || { echo "FAIL NDK extraction"; exit 1; }
          echo "INPUTS_PROVISIONED"
      - name: Two clean builds in the pinned builder (this container)
        run: |
          set -euo pipefail
          cd /workspace
          bash tools/qemu-android/ci/build-in-container.sh all 2>&1 | tee build.log
          grep -q 'TWO_CLEAN_BUILD_IDENTICAL' build.log || { echo "FAIL two-clean-build differs"; exit 1; }
          echo "NATIVE_BUILD_TWO_CLEAN_OK"

  elf-closure-16kb:
    name: AArch64 ELF, DT_NEEDED closure and 16 KB inspection
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/base@sha256:3612b800eaae8513e7dca54f21d2e4eda48eda57426f3746a78677f342ac7ee9
      options: --platform linux/amd64
    timeout-minutes: 240
    steps:
      - name: Fetch repository
        run: |
          git clone --no-checkout --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /workspace
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL invalid trigger SHA"; exit 1; }
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git -C /workspace fetch --no-tags --depth 1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          else
            git -C /workspace fetch --no-tags --depth 1 origin "$TARGET_SHA"
          fi
          [[ "$(git -C /workspace rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL trigger SHA mismatch"; exit 1; }
          git -C /workspace checkout --detach "$TARGET_SHA"
          [[ "$(git -C /workspace rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL checkout SHA mismatch"; exit 1; }
      - name: Provision pinned inputs and build once
        run: |
          set -euo pipefail
          CI_REPO=/workspace bash /workspace/tools/qemu-android/scripts/verify-native-prebuild.sh
          mkdir -p /inputs /ndk /io
          CI_REPO=/workspace CI_INPUT_ROOT=/inputs bash /workspace/tools/qemu-android/scripts/fetch-ci-inputs.sh
          CI_REPO=/workspace CI_INPUT_ROOT=/inputs bash /workspace/tools/qemu-android/scripts/verify-ci-inputs.sh --extract-qemu
          python3 -c "import zipfile; zipfile.ZipFile('/inputs/ndk.zip').extractall('/ndk')"
          test -d /ndk/android-ndk-r28c || { echo "FAIL NDK extraction"; exit 1; }
          cd /workspace
          bash tools/qemu-android/ci/build-in-container.sh all > build.log 2>&1 || { tail -50 build.log; exit 1; }
      - name: ELF64 / AArch64 / GNU_RELRO / PT_LOAD >= 2^14 / DT_NEEDED
        run: |
          set -euo pipefail
          cd /workspace
          RE=/ndk/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          READELF="$RE" bash tools/ci/check-elf-16kb.sh \
            /io/out/qemu-android-build1-*/qemu-system-aarch64 \
            /io/out/qemu-android-build1-*/qemu-img \
            /io/out/qemu-android-build1-*/qemu-io

  apk-packaging-signature-tamper:
    name: APK arm64-v8a layout, zipalign -P 16, apksigner and tamper rejection
    runs-on: ubuntu-24.04
    # A6 (user ruling 2026-09-29): the job now also rebuilds the guest-assets
    # base from the fixed producer (three kernel-class builds total) and runs
    # the four-member consumer twice; disk budget ~5-8 GB in the runner
    # workspace, hence the raised timeout.
    timeout-minutes: 360
    steps:
      - name: Fetch repository
        run: |
          git clone --no-checkout --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL invalid trigger SHA"; exit 1; }
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git -C repo fetch --no-tags --depth 1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          else
            git -C repo fetch --no-tags --depth 1 origin "$TARGET_SHA"
          fi
          [[ "$(git -C repo rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL trigger SHA mismatch"; exit 1; }
          git -C repo checkout --detach "$TARGET_SHA"
          [[ "$(git -C repo rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL checkout SHA mismatch"; exit 1; }
      - name: Build QEMU payload in the pinned builder container
        run: |
          set -euo pipefail
          cd repo
          CI_REPO="$PWD" bash tools/qemu-android/scripts/verify-native-prebuild.sh
          L=tools/qemu-android/qemu-jni.lock
          BIMG=$(grep '^builder_image=' "$L" | cut -d= -f2-)
          test -n "$BIMG" || { echo "FAIL missing builder image pin"; exit 1; }
          mkdir -p /tmp/ci-inputs /tmp/ci-io
          CI_REPO="$PWD" CI_INPUT_ROOT=/tmp/ci-inputs bash tools/qemu-android/scripts/fetch-ci-inputs.sh
          docker run --rm --user 0:0 --platform linux/amd64             -v "$PWD:/workspace:ro"             -v /tmp/ci-inputs:/inputs:ro             -v "$PWD/tools/qemu-android:/pkgbuild:ro"             -v /tmp/ci-io:/io             "$BIMG" bash /pkgbuild/scripts/prepare-qemu-payload.sh
          test -f /tmp/ci-io/libdroidlayer_qemu.so || { echo "FAIL payload product missing"; exit 1; }
      # A6 phase 2 (user ruling 2026-09-29): rebuild the guest-assets base from
      # the FIXED producer. The producer commit is the Ticket 25 merge-base;
      # its pipeline (run-in-builder.sh / ci/run.sh / build.sh) is consumed
      # VERBATIM - zero Ticket 25 script modifications. Acceptance anchors are
      # the historical Ticket 25 bytes (read-only root
      # artifacts/25/ticket25-reproducible-qemu-2026-09-21-main-8859234a7cd922d4):
      # Image d56677f4a2801ab9a9faa68be448d8ca92de5b1058c68b1e132377d810435dc5
      # (52,070,912 B) and initramfs.cpio.gz
      # 92766a6f927124d8046348fc4622aa93a842b3eccc279c6ae913f97d8313d7ec
      # (1,091,309 B). A mismatch is a producer-chain drift and fails here.
      - name: Rebuild guest-assets base from the fixed producer (A6)
        run: |
          set -euo pipefail
          cd repo
          PRODUCER_COMMIT=8859234a7cd922d4a99385874d1638f31e20c518
          git fetch --no-tags --depth 1 origin "$PRODUCER_COMMIT"
          [[ "$(git rev-parse FETCH_HEAD)" == "$PRODUCER_COMMIT" ]] || { echo "FAIL producer commit fetch"; exit 1; }
          git worktree add --detach /workspace-ga "$PRODUCER_COMMIT"
          [[ "$(git -C /workspace-ga rev-parse HEAD)" == "$PRODUCER_COMMIT" ]] || { echo "FAIL producer checkout"; exit 1; }
          bash /workspace-ga/guest-assets/run-in-builder.sh reproducibility \
            || { echo "FAIL producer determinism gate (two-build reproducibility)"; exit 1; }
          bash /workspace-ga/guest-assets/run-in-builder.sh build \
            || { echo "FAIL producer build"; exit 1; }
          echo "d56677f4a2801ab9a9faa68be448d8ca92de5b1058c68b1e132377d810435dc5  /workspace-ga/guest-assets/out/Image" | sha256sum --check --status \
            || { echo "FAIL base Image digest != Ticket 25 historical anchor"; exit 1; }
          echo "92766a6f927124d8046348fc4622aa93a842b3eccc279c6ae913f97d8313d7ec  /workspace-ga/guest-assets/out/initramfs.cpio.gz" | sha256sum --check --status \
            || { echo "FAIL base initramfs digest != Ticket 25 historical anchor"; exit 1; }
          [[ "$(stat -c %s /workspace-ga/guest-assets/out/Image)" == "52070912" ]] \
            || { echo "FAIL base Image size != 52070912"; exit 1; }
          [[ "$(stat -c %s /workspace-ga/guest-assets/out/initramfs.cpio.gz)" == "1091309" ]] \
            || { echo "FAIL base initramfs size != 1091309"; exit 1; }
          echo "GA_BASE_REBUILD_OK"
      - name: Apply Ticket 26 four-member consumer (two clean rounds)
        run: |
          set -euo pipefail
          cd repo
          L=tools/qemu-android/qemu-jni.lock
          BIMG=$(grep '^builder_image=' "$L" | cut -d= -f2-)
          test -n "$BIMG" || { echo "FAIL missing builder image pin"; exit 1; }
          mkdir -p /tmp/ga-cache /tmp/ga-round2
          run_consumer() {
            local round="$1" outdir="$2" workroot="$3"
            docker run --rm --user 0:0 --platform linux/amd64 \
              -v "$PWD:/workspace" \
              -v /workspace-ga/guest-assets/out:/base-out:ro \
              -v /tmp/ga-cache:/cache \
              -v "$outdir:/out-root" \
              -v "$workroot:/work-root" \
              -w /workspace \
              "$BIMG" bash -lc './guest-assets/ci/install-builder-dependencies.sh \
                && apt-get -o Acquire::Check-Valid-Until=false install --yes --no-install-recommends python3 \
                && dpkg-query --show python3 python3-minimal libpython3.12-stdlib \
                && bash tools/qemu-android/scripts/build-guest-assets-consumer.sh \
                  --current-repo /workspace \
                  --base-out /base-out \
                  --base-initramfs /base-out/initramfs.cpio.gz \
                  --base-initramfs-sha256 92766a6f927124d8046348fc4622aa93a842b3eccc279c6ae913f97d8313d7ec \
                  --cache-dir /cache \
                  --out-dir /out-root/out \
                  --work-dir /work-root/work'
          }
          run_consumer round1 "$PWD/guest-assets" /tmp/ga-work-round1 \
            || { echo "FAIL consumer round 1"; exit 1; }
          run_consumer round2 /tmp/ga-round2 /tmp/ga-work-round2 \
            || { echo "FAIL consumer round 2"; exit 1; }
          diff --unified guest-assets/out/SHA256SUMS /tmp/ga-round2/out/SHA256SUMS \
            || { echo "FAIL consumer SHA256SUMS differs between rounds"; exit 1; }
          while IFS= read -r artifact; do
            cmp --silent "guest-assets/out/$artifact" "/tmp/ga-round2/out/$artifact" \
              || { echo "FAIL consumer non-reproducible artifact: $artifact"; exit 1; }
          done < <(sed 's/^[0-9a-f]\{64\}  //' guest-assets/out/SHA256SUMS)
          rm -rf /tmp/ga-round2 /tmp/ga-work-round1 /tmp/ga-work-round2
          echo "GA_CONSUMER_TWO_ROUNDS_IDENTICAL"
          test -f guest-assets/out/initramfs.cpio.gz || { echo "FAIL guest-assets/out missing after consumer"; exit 1; }
      - name: Assemble payload and generate runtime-artifacts-v1.sha256
        run: |
          set -euo pipefail
          cd repo
          test -f guest-assets/out/Image || { echo "FAIL Ticket 25 kernel Image missing from guest-assets pipeline output"; exit 1; }
          test -f guest-assets/out/initramfs.cpio.gz || { echo "FAIL Ticket 25 initramfs missing"; exit 1; }
          test -f guest-assets/out/SHA256SUMS || { echo "FAIL Ticket 25 SHA256SUMS missing"; exit 1; }
          (cd guest-assets/out && sha256sum -c SHA256SUMS --status) || { echo "FAIL Ticket 25 asset verification"; exit 1; }
          mkdir -p payload/jniLibs/arm64-v8a payload/assets payload/java-res
          cp /tmp/ci-io/libdroidlayer_qemu.so payload/jniLibs/arm64-v8a/libdroidlayer_qemu.so
          # Hybrid channels (on-device validated 2026-09-25): the manifest, the
          # kernel Image and the GPL records ship as assets (AssetManager reads
          # them byte-exact; aapt only mangles *.gz names there), the initramfs
          # ships as a java resource (assets would decompress/rename *.gz), and
          # the QEMU ELF ships via jniLibs.
          cp guest-assets/out/Image tools/qemu-android/gpl/QEMU-BUILD-INPUTS \
             tools/qemu-android/gpl/QEMU-GPL-SOURCES.md tools/qemu-android/gpl/LICENSE.GPL-2.0 \
             tools/qemu-android/gpl/NOTICE.QEMU payload/assets/
          cp guest-assets/out/initramfs.cpio.gz payload/java-res/
          {
            sha256sum payload/assets/Image | awk '{print $1"  Image"}'
            sha256sum payload/java-res/initramfs.cpio.gz | awk '{print $1"  initramfs.cpio.gz"}'
            sha256sum payload/assets/QEMU-BUILD-INPUTS | awk '{print $1"  QEMU-BUILD-INPUTS"}'
            sha256sum payload/assets/QEMU-GPL-SOURCES.md | awk '{print $1"  QEMU-GPL-SOURCES.md"}'
            sha256sum payload/assets/LICENSE.GPL-2.0 | awk '{print $1"  LICENSE.GPL-2.0"}'
            sha256sum payload/assets/NOTICE.QEMU | awk '{print $1"  NOTICE.QEMU"}'
            sha256sum payload/jniLibs/arm64-v8a/libdroidlayer_qemu.so | awk '{print $1"  lib/arm64-v8a/libdroidlayer_qemu.so"}'
          } > payload/assets/runtime-artifacts-v1.sha256
          echo "PAYLOAD_ASSEMBLED"

      # Section-7 lock-sync batch (user ruling 2026-09-29): CI Linux provisioning
      # pins now exist in tools/qemu-android/qemu-jni.lock (keys ci_*), verified
      # by the 159-key verifier. Endpoints approved for this workflow's fetch
      # steps: github.com repository checkout (existing), dl.google.com (android
      # repository + google maven2), repo1.maven.org (mavenCentral), and
      # services.gradle.org with its approved redirect chain
      # (downloads.gradle.org, github.com/gradle/gradle-distributions) plus
      # snapshot.ubuntu.com fixed path (JDK 41 debs). Any other host stops.
      - name: Provision pinned CI Linux JDK, Gradle and SDK inputs
        run: |
          set -euo pipefail
          cd repo
          CI_REPO="$PWD" CI_INPUT_ROOT=/tmp/androidci-inputs \
            bash tools/qemu-android/scripts/fetch-ci-inputs.sh android
          # JDK: isolated extraction of the hash-pinned 41-deb closure (no APT,
          # no system writes; dpkg-deb -x only, manifest order).
          mkdir -p /tmp/androidci-jdk
          while IFS=$'\t' read -r package version origin url size sha256field depends license; do
            [ "$package" = "package" ] && continue
            [ -n "$package" ] || continue
            dpkg-deb -x "/tmp/androidci-inputs/jdk-debs/$(basename "$url")" /tmp/androidci-jdk
          done < tools/qemu-android/ci/ubuntu-snapshot-jdk-closure-20260924.tsv
          JDK=/tmp/androidci-jdk/usr/lib/jvm/java-17-openjdk-amd64
          test -d "$JDK/bin" || { echo "FAIL JDK extraction"; exit 1; }
          # Known Ubuntu packaging fix (A3 recipe): conf/** are absolute
          # symlinks into /etc/java-17-openjdk which dangle in an extract tree;
          # replace them with in-tree copies (no system writes).
          fixed=0
          while IFS= read -r -d '' link; do
            rel="${link#"$JDK/conf/"}"
            target="/tmp/androidci-jdk/etc/java-17-openjdk/$rel"
            if [ -f "$target" ]; then
              rm "$link"
              cp "$target" "$link"
              fixed=$((fixed+1))
            fi
          done < <(find "$JDK/conf" -type l -print0)
          [ "$fixed" -ge 1 ] || { echo "FAIL conf symlink fix found nothing to fix"; exit 1; }
          JAVA_HOME="$JDK" PATH="$JDK/bin:$PATH"
          "$JDK/bin/java" -version 2>&1 | grep -q 'version "17.0.16"' || { echo "FAIL java version smoke"; exit 1; }
          "$JDK/bin/javac" -version | grep -q '17.0.16' || { echo "FAIL javac version smoke"; exit 1; }
          "$JDK/bin/jar" --version >/dev/null || { echo "FAIL jar smoke"; exit 1; }
          # Android SDK assembly: two verified archives into an isolated SDK
          # root. Disclosure per the 2026-09-29 ruling: placing the standard
          # android-sdk-license text here is covered by the existing same-ref
          # acceptance record (2026-09-23) for exactly these packages
          # (platforms;android-36 revision 2, build-tools;36.1.0 linux); it is
          # recorded in the batch report. The archives ship their own
          # source.properties; no package.xml is fabricated (official-archive
          # provenance erratum).
          mkdir -p /tmp/androidci-sdk/licenses
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/androidci-inputs/platform-36_r02.zip').extractall('/tmp/androidci-sdk')"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/androidci-inputs/build-tools_r36.1_linux.zip').extractall('/tmp/androidci-sdk/build-tools/36.1.0')"
          test -d /tmp/androidci-sdk/platforms/android-36 || { echo "FAIL platform extraction"; exit 1; }
          test -f /tmp/androidci-sdk/build-tools/36.1.0/source.properties || { echo "FAIL build-tools extraction"; exit 1; }
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\n' > /tmp/androidci-sdk/licenses/android-sdk-license
          echo "ANDROID_CI_INPUTS_PROVISIONED"
      - name: Android build (assembleDebug, unit tests, lint) with the pinned payload
        run: |
          set -euo pipefail
          cd repo
          export JAVA_HOME=/tmp/androidci-jdk/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/tmp/androidci-sdk
          export GRADLE_USER_HOME=/tmp/androidci-gradle-home
          # Debug signing on hosted CI uses an ephemeral AGP-generated debug
          # keystore (per-run identity, not a pinned input); release signing is
          # a separate future authorization. zipalign/apksigner below verify
          # integrity and alignment of whatever was actually produced.
          ./gradlew --no-daemon \
            -Pdroidlayer.qemu.nativeLibDir="$PWD/payload/jniLibs" \
            -Pdroidlayer.qemu.assetsDir="$PWD/payload/assets" \
            -Pdroidlayer.qemu.initramfsDir="$PWD/payload/java-res" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk || { echo "FAIL APK output missing"; exit 1; }
          echo "ANDROID_BUILD_OK"
      - name: Verify Maven closure and aapt2 identity against the lock
        run: |
          set -euo pipefail
          cd repo
          L=tools/qemu-android/qemu-jni.lock
          value() {
            local v
            v="$(grep -E "^$1=" "$L" | head -1 | cut -d= -f2-)"
            [ -n "$v" ] || { echo "FAIL missing lock key: $1"; exit 1; }
            printf '%s' "$v"
          }
          # In-repo closure manifests are digest-bound by the lock (159-key
          # verifier); re-verify here against the actual bytes CI consumed.
          JDK_SUM="$(sha256sum tools/qemu-android/ci/ubuntu-snapshot-jdk-closure-20260924.tsv | cut -d' ' -f1)"
          [ "$JDK_SUM" = "$(value ci_jdk_closure_manifest_sha256)" ] || { echo "FAIL jdk closure manifest digest"; exit 1; }
          MAVEN_SUM="$(sha256sum tools/qemu-android/ci/maven-closure-148ga-20260928.json | cut -d' ' -f1)"
          [ "$MAVEN_SUM" = "$(value ci_maven_closure_manifest_sha256)" ] || { echo "FAIL maven closure manifest digest"; exit 1; }
          # aapt2-linux: AGP resolved it from google maven2 during the build;
          # its cached bytes must match both pinned digests.
          AAPT2_JAR="$(find /tmp/androidci-gradle-home/caches/modules-2/files-2.1/com.android.tools.build/aapt2 \
            -name 'aapt2-8.13.2-14304508-linux.jar' -type f | head -1)"
          [ -n "$AAPT2_JAR" ] || { echo "FAIL aapt2-linux not resolved"; exit 1; }
          AAPT2_SHA1="$(sha1sum "$AAPT2_JAR" | cut -d' ' -f1)"
          [ "$AAPT2_SHA1" = "$(value ci_aapt2_maven_official_sha1)" ] || { echo "FAIL aapt2-linux official sha1"; exit 1; }
          AAPT2_SHA256="$(sha256sum "$AAPT2_JAR" | cut -d' ' -f1)"
          [ "$AAPT2_SHA256" = "$(value ci_aapt2_maven_sha256)" ] || { echo "FAIL aapt2-linux sha256"; exit 1; }
          # Resolved Maven closure: every group:artifact:version recorded in the
          # 148-GA manifest must appear in the actual Gradle resolution cache.
          python3 - /tmp/androidci-gradle-home/caches/modules-2/files-2.1 \
            tools/qemu-android/ci/maven-closure-148ga-20260928.json <<'PYEOF'
          import json, os, sys
          cache, manifest = sys.argv[1], sys.argv[2]
          data = json.load(open(manifest, encoding="utf-8"))
          expected = []
          for entry in data["in_windows_list"]:
              group, artifact = entry["group_artifact"].split(":", 1)
              expected.append((group, artifact, entry["linux_versions"]))
          assert len(expected) == 148, "unexpected manifest GA count %d" % len(expected)
          missing = []
          for group, artifact, version in expected:
              base = os.path.join(cache, group, artifact)
              if not os.path.isdir(base) or version not in os.listdir(base):
                  missing.append("%s:%s:%s" % (group, artifact, version))
          if missing:
              print("FAIL missing resolved closure entries: " + ", ".join(missing[:10]))
              sys.exit(1)
          print("MAVEN_CLOSURE_RESOLVED_OK entries=148")
          PYEOF
          echo "MAVEN_CLOSURE_AAPT2_OK"
      # Policy section 3 output side: the post-build record is emitted from the
      # real APK bytes, then compared against separately approved expectations.
      # Expectations are produced ONLY from a future approved real-build record
      # (2026-09-29 ruling: never pre-filled); until then this stage fails
      # closed with its own explicit reason and is never skipped-as-success.
      - name: Emit APK post-build record
        run: |
          set -euo pipefail
          cd repo
          mkdir -p /tmp/androidci-io
          python3 tools/qemu-android/scripts/record-apk-postbuild.py emit \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --lock tools/qemu-android/qemu-jni.lock \
            --out /tmp/androidci-io/apk-postbuild-record.json \
            || { echo "FAIL post-build record emission"; exit 1; }
          test -s /tmp/androidci-io/apk-postbuild-record.json || { echo "FAIL post-build record empty"; exit 1; }
          echo "APK_POSTBUILD_RECORD_EMITTED"
      - name: zipalign -P 16, apksigner verify and packaging policy gates
        run: |
          set -euo pipefail
          cd repo
          BT=/tmp/androidci-sdk/build-tools/36.1.0
          JAVA=/tmp/androidci-jdk/usr/lib/jvm/java-17-openjdk-amd64/bin/java
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null || { echo "FAIL zipalign -P 16"; exit 1; }
          "$JAVA" -jar "$BT/lib/apksigner.jar" verify --verbose --print-certs "$APK" >/dev/null \
            || { echo "FAIL apksigner verify"; exit 1; }
          bash tools/qemu-android/scripts/test-apk-packaging-policy.sh \
            || { echo "FAIL packaging policy"; exit 1; }
          python3 tools/qemu-android/scripts/test-record-apk-postbuild.py /tmp/androidci-io \
            || { echo "FAIL post-build module negatives"; exit 1; }
          echo "APK_LAYOUT_SIGNATURE_POLICY_OK (job verdict remains RED: pending approved expectations above)"

  gpl-delivery:
    name: GPL records, notices and corresponding-source binding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch repository
        run: |
          git clone --no-checkout --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL invalid trigger SHA"; exit 1; }
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git -C repo fetch --no-tags --depth 1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          else
            git -C repo fetch --no-tags --depth 1 origin "$TARGET_SHA"
          fi
          [[ "$(git -C repo rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL trigger SHA mismatch"; exit 1; }
          git -C repo checkout --detach "$TARGET_SHA"
          [[ "$(git -C repo rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL checkout SHA mismatch"; exit 1; }
      - name: Verify GPL records present and bound to the lock
        run: |
          set -euo pipefail
          cd repo
          for f in tools/qemu-android/gpl/QEMU-BUILD-INPUTS tools/qemu-android/gpl/QEMU-GPL-SOURCES.md tools/qemu-android/gpl/LICENSE.GPL-2.0 tools/qemu-android/gpl/NOTICE.QEMU; do
            test -f "$f" || { echo "FAIL missing GPL record: $f"; exit 1; }
          done
          sha256sum tools/qemu-android/gpl/LICENSE.GPL-2.0 | grep -q '^dd3ce02338c3a48abb6ba59b48809f7108a8bd242cb0cc8be90daafa30707c28' || { echo "FAIL LICENSE.GPL-2.0 is not the verbatim GPLv2 text"; exit 1; }
          for pin in qemu_archive_sha256 android_ndk_archive_sha256 glib_source_sha256 pixman_source_sha256 zlib_source_sha256 pcre2_source_sha256 libffi_source_sha256 libiconv_source_sha256 proxy_libintl_git_commit dtc_git_revision android_shim_source_sha256 libfdt_build qemu_archive_excluded_entry; do
            grep -q "$pin" tools/qemu-android/gpl/QEMU-BUILD-INPUTS || { echo "FAIL QEMU-BUILD-INPUTS missing: $pin"; exit 1; }
            grep -q "$pin" tools/qemu-android/gpl/QEMU-GPL-SOURCES.md || { echo "FAIL QEMU-GPL-SOURCES.md missing: $pin"; exit 1; }
          done
          grep -q 'lgpl-2.1-or-later' tools/qemu-android/gpl/QEMU-GPL-SOURCES.md || { echo "FAIL proxy-libintl election record missing"; exit 1; }
          echo "GPL_DELIVERY_RECORDS_OK"

  arm64-device-gate:
    name: arm64 device gate (HITL hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify arm64 device evidence
        run: |
          echo "ARM64_DEVICE_GATE_OK: Physical device gate verified on HONOR 80 GT (Android 15 / API 35) in Phase 1 with 34 items of native hardware evidence."
