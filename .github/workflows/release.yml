name: Release Build Gate

# Manual only. This workflow builds and verifies a signed release candidate and
# uploads the artifacts; it never creates a tag or a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select yes to build and verify a release candidate
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      version_name:
        description: Expected release versionName (for example 0.6.0)
        required: true
        type: string
      publish:
        description: Select yes to also create a DRAFT GitHub Release from the verified bundle
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

# A re-dispatch on the same ref supersedes the release build in flight.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-release:
    name: Build and verify release APK
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Require a clean tracked worktree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Release builds require a clean tracked worktree."
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Accept Android SDK licenses and install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            if ! "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973"; then
              echo "::error::sdkmanager could not install platforms;android-36, build-tools;36.1.0 and ndk;27.0.12077973"
              exit 1
            fi
          fi

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured; refusing to build an unsigned release."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Write signing properties without echoing secrets
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured; refusing to build an unsigned release."
              exit 1
            fi
          done
          mkdir -p "$HOME/.gradle"
          {
            printf 'orchestella.signing.storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'orchestella.signing.storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'orchestella.signing.keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'orchestella.signing.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify CI/release module coverage and AVF harness wiring
        run: |
          python3 tools/ci/test_check_ci_module_coverage.py
          python3 tools/ci/check_ci_module_coverage.py

      - name: Run all runtime checks and app unit tests
        run: |
          bash tools/ci/run-gradle-gate.sh \
            :runtime:contract:check \
            :runtime:instance:check \
            :runtime:engine-qemu:check \
            :runtime:engine-avf:check \
            :runtime:capability:check \
            :runtime:distro:check \
            :runtime:network:check \
            :runtime:engine-fastlane:check \
            :runtime:fastlane-distcc:check \
            :runtime:fastlane-telemetry:check \
            :runtime:fastlane-capability:check \
            :runtime:fastlane-storage:check \
            :runtime:fastlane-proxy:check \
            :runtime:fastlane-terminal:check \
            :app:testDebugUnitTest

      - name: Upload Gradle gate log and failed-task summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gradle-gate-${{ github.run_id }}
          path: |
            build/ci/gradle-gate.log
            build/ci/gradle-gate-summary.txt
          if-no-files-found: warn

      - name: Run lint and assemble debug for the packaging gate
        # Clean checkout: the git-ignored QEMU payload is absent, which is the
        # known baseline for this job. The real payload is gated later by
        # check_runtime_payload.py --apk against the produced APK.
        # Single-package round (2026-11-14): the UML flags default ON in gradle
        # (the complete-package factory facts); on this hosted checkout the
        # machine staging inputs are absent, so the staging tasks record the
        # absence (WARN + build marker) and skip — the hosted build stays the
        # honest no-payload test form. The shippable single-package APK is
        # built ONLY on the packaging machine that owns the staging inputs
        # (the packaging-machine work order — internal documentation that no
        # longer rides the public tree — carries the full build line and the
        # acceptance checklist); hosted CI cannot produce it and does not
        # pretend to.
        run: ./gradlew :app:lintDebug :app:assembleDebug -Porchestella.assets.allowMissingPayload=true --no-daemon --stacktrace

      - name: Verify debug APK 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        # Same clean-checkout baseline as the debug gate above. allowMissingPayload
        # stays: no step of this job produces the QEMU payload (it is git-ignored,
        # absent from a clean checkout), the APK built here therefore cannot boot
        # the QEMU lane, and publish-draft refuses to draft from such a bundle —
        # the real payload-bearing single-package APK is built on the packaging
        # machine (all four staging parameters + the pVM repack chain, no
        # exemption).
        # ACR 2026-11-12 D1+D4 stated-parameter discipline, updated 2026-11-14:
        # the four UML flags now default ON (single-package factory facts), and
        # this pipeline still states them explicitly so the release build never
        # depends on a gradle default to get them right. On this hosted checkout
        # the machine staging inputs are absent, so the staging tasks record the
        # absence and skip (the APK carries no UML assets; the runtime answers
        # MISSING_ASSET / SPAWN_FAILED with named details honestly); the
        # packaging machine adds -Porchestella.uml.fastProfileDir / .netHelperDir
        # / -Porchestella.fastlane.payloadLibDir / -Porchestella.pvmCompiler.libDir
        # and gets the fail-closed sha-accounted staging plus the pVM stored-entry
        # repack for real.
        # The accelerator lane is stated explicitly even though the Gradle
        # default is now on: v0.6.3 shipped with the lane compiled out, so the
        # release pipeline must never depend on a default to get this right.
        run: ./gradlew :app:assembleRelease -Porchestella.assets.allowMissingPayload=true -Porchestella.acceleratorLane=true -Porchestella.uml.bundledFastProfile=true -Porchestella.uml.fastProfile=true -Porchestella.uml.compileBridge=true -Porchestella.uml.rootfsDownload=true --no-daemon --stacktrace

      - name: Locate release APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify release APK 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh "$APK_PATH"

      - name: Verify release identity, certificate and checksum
        run: |
          python3 tools/release/verify_apk.py \
            --apk "$APK_PATH" \
            --expected-application-id io.github.nyzeep.orchestella \
            --expected-version-name "$VERSION_NAME" \
            --json release-verification.json

      - name: Verify license, NOTICE and source-offer bundle
        run: python3 tools/release/check_licenses.py

      - name: Guard against sensitive developer data
        run: |
          python3 tools/ci/check_sensitive_data.py --self-test
          python3 tools/ci/check_sensitive_data.py

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp "$APK_PATH" "release-bundle/Orchestella-Studio-v${VERSION_NAME}-release.apk"
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path(".")
          output = pathlib.Path("release-bundle")
          manifest = json.loads((root / "tools/release/release_bundle_manifest.json").read_text(encoding="utf-8"))
          for relative in manifest["files"]:
              source = root / relative
              if not source.is_file():
                  raise SystemExit("missing release bundle file: " + relative)
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY
          (cd release-bundle && sha256sum *.apk > SHA256SUMS)
          cat release-bundle/SHA256SUMS

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchestella-release-candidate
          path: |
            release-bundle/
            release-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$HOME/.gradle/gradle.properties"

  # Draft-only publication. Nothing here can make a release public: the CLI is
  # invoked with --draft, the job needs an explicit publish=yes on top of a
  # verified build, and the QEMU/UML gates below refuse any bundle that does
  # not carry the payloads (i.e. any bundle not built on the packaging machine
  # — hosted CI has no staging inputs and its exemption-form APKs are test
  # artifacts, never drafts). Single-package round: the draft APK is the ONE
  # package (QEMU + UML + pVM engines inside the main APK); there is no
  # accelerator extension APK to build or attach anymore.
  publish-draft:
    name: Create draft GitHub Release
    needs: build-release
    if: ${{ inputs.confirm == 'yes' && inputs.publish == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: orchestella-release-candidate
          path: release-bundle

      - name: Resolve release notes (tolerate an absent local notes file)
        # Single-package round: docs/ stopped riding the public tree, so a
        # curated notes file at docs/reports/releases/ is optional now. When
        # it exists it is used verbatim; when it does not, a minimal standard
        # header is generated so the draft can still be created (editors fill
        # in the body before publishing).
        run: |
          NOTES="docs/reports/releases/v${VERSION_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"
          else
            GENERATED="$RUNNER_TEMP/release-notes-v${VERSION_NAME}.md"
            {
              echo "# Orchestella Studio v${VERSION_NAME}"
              echo
              echo "_Curated release notes were not found in the tree for this version;"
              echo "replace this placeholder before publishing the draft._"
              echo
              echo "Single-package build: the QEMU, UML and pVM engines ship inside the main APK."
            } > "$GENERATED"
            echo "NOTES_FILE=$GENERATED" >> "$GITHUB_ENV"
            echo "::notice::no curated notes at $NOTES — generated a placeholder at $GENERATED"
          fi

      # session 26: 0.6.0 shipped without the QEMU payload (it is gitignored, so a clean
      # checkout builds an APK that installs and then reports "Linux 实例不可用").
      # Refuse to draft a release from such a bundle.
      - name: Require the QEMU runtime payload in the APK
        run: |
          set -euo pipefail
          APK=$(ls release-bundle/*.apk | head -1)
          if ! python3 tools/release/check_runtime_payload.py --apk "$APK"; then
            echo "::error::the bundle APK is not a complete, self-consistent single \
          package (UML fast profile + net helper manifests, embedded rootfs tar, pVM \
          compiler manifest pins, QEMU manifest, NOTICE.UML). Rebuild on the packaging \
          machine with all four staging parameters (-Porchestella.uml.fastProfileDir / \
          .netHelperDir / -Porchestella.fastlane.payloadLibDir / \
          -Porchestella.pvmCompiler.libDir) and the repack chain; shipped bytes and \
          manifests must agree."
            exit 1
          fi

      # ACR 2026-11-12 D1/D4, review P2-1 closure; tightened 2026-11-14
      # (single-package round) and again by the 2026-11-14 review: a draftable
      # release is a single-package APK built on the packaging machine, so the
      # gate runs at its strongest shape (--fullpkg): BOTH UML accounting
      # manifests (fast profile AND net helper) are required, the embedded
      # rootfs tar must be staged and accounted, the pVM compiler manifest's
      # three library pins must match the shipped bytes, the QEMU manifest is
      # reconciled entry-for-entry, and NOTICE.UML must ship. The hosted
      # no-payload form never reaches this job (the QEMU gate above refuses it
      # first), and a skip-tolerant UML gate would re-open the "flag-on but
      # nothing staged" hole this gate exists to close.
      - name: Verify the single-package payload accounting in the APK
        run: |
          set -euo pipefail
          APK=$(ls release-bundle/*.apk | head -1)
          if ! python3 tools/release/check_uml_payload.py --apk "$APK" --fullpkg; then
            echo "::error::the bundle APK's UML payloads do not match their in-APK \
          accounting manifests (assets/uml-fast-profile-v1.sha256 and \
          assets/uml-net-helper-v1.sha256). Rebuild on the packaging machine with \
          -Porchestella.uml.fastProfileDir=<pinned U1 artifacts> and \
          -Porchestella.uml.netHelperDir=<netfwd pair>; shipped bytes and manifests \
          must agree."
            exit 1
          fi

      - name: Create the draft release with the main APK and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" \
            --draft \
            --title "Orchestella Studio v${VERSION_NAME}" \
            --notes-file "$NOTES_FILE" \
            release-bundle/*.apk \
            release-bundle/SHA256SUMS
          echo "::notice::Draft created. The single-package APK carries the QEMU, UML and \
          pVM engines; no accelerator extension APK is attached (the two-package split \
          is retired for release builds)."
