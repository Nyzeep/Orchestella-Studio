name: Release Build Gate

# Manual only. This workflow builds and verifies a signed release candidate and
# uploads the artifacts; it never creates a tag or a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select yes to build and verify a release candidate
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      version_name:
        description: Expected release versionName (for example 0.6.0)
        required: true
        type: string
      publish:
        description: Select yes to also create a DRAFT GitHub Release from the verified bundle
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

# A re-dispatch on the same ref supersedes the release build in flight.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-release:
    name: Build and verify release APK
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Require a clean tracked worktree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Release builds require a clean tracked worktree."
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Accept Android SDK licenses and install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            if ! "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973"; then
              echo "::error::sdkmanager could not install platforms;android-36, build-tools;36.1.0 and ndk;27.0.12077973"
              exit 1
            fi
          fi

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured; refusing to build an unsigned release."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Write signing properties without echoing secrets
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured; refusing to build an unsigned release."
              exit 1
            fi
          done
          mkdir -p "$HOME/.gradle"
          {
            printf 'orchestella.signing.storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'orchestella.signing.storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'orchestella.signing.keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'orchestella.signing.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify CI/release module coverage and AVF harness wiring
        run: |
          python3 tools/ci/test_check_ci_module_coverage.py
          python3 tools/ci/check_ci_module_coverage.py

      - name: Run all runtime checks and app unit tests
        run: |
          bash tools/ci/run-gradle-gate.sh \
            :runtime:contract:check \
            :runtime:instance:check \
            :runtime:engine-qemu:check \
            :runtime:engine-avf:check \
            :runtime:capability:check \
            :runtime:distro:check \
            :runtime:network:check \
            :runtime:engine-fastlane:check \
            :runtime:fastlane-distcc:check \
            :runtime:fastlane-telemetry:check \
            :runtime:fastlane-capability:check \
            :runtime:fastlane-storage:check \
            :runtime:fastlane-proxy:check \
            :runtime:fastlane-terminal:check \
            :app:testDebugUnitTest

      - name: Upload Gradle gate log and failed-task summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gradle-gate-${{ github.run_id }}
          path: |
            build/ci/gradle-gate.log
            build/ci/gradle-gate-summary.txt
          if-no-files-found: warn

      - name: Run lint and assemble debug for the packaging gate
        # Clean checkout: the git-ignored QEMU payload is absent, which is the
        # known baseline for this job. The real payload is gated later by
        # check_runtime_payload.py --apk against the produced APK.
        run: ./gradlew :app:lintDebug :app:assembleDebug -Porchestella.assets.allowMissingPayload=true --no-daemon --stacktrace

      - name: Verify debug APK 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        # Same clean-checkout baseline as the debug gate above. allowMissingPayload
        # stays: no step of this job produces the QEMU payload (it is git-ignored,
        # absent from a clean checkout), the APK built here therefore cannot boot
        # the QEMU lane, and publish-draft refuses to draft from such a bundle —
        # the real payload-bearing APK is built on the packaging machine.
        # ACR 2026-11-12 D1+D4: the UML fast-profile lane is stated explicitly
        # like the accelerator lane, so the release pipeline never depends on a
        # default to get this right. On this hosted checkout the U1 artifacts are
        # absent too, so stageUmlFastProfile records the absence and skips (the
        # APK ships no UML kernel; the runtime answers MISSING_ASSET honestly);
        # the packaging machine adds -Porchestella.uml.fastProfileDir=<U1 dir>
        # and gets the fail-closed sha-accounted staging for real.
        # The accelerator lane is stated explicitly even though the Gradle
        # default is now on: v0.6.3 shipped with the lane compiled out, so the
        # release pipeline must never depend on a default to get this right.
        # A fourth stated-parameter flag exists since the 2026-11-13 compile-
        # bridge round: -Porchestella.uml.compileBridge=<bool> (Gradle default
        # false) gates the UML face's UML-TCP compile lane wiring. Whether the
        # release pipeline passes it this round is a deliberate decision, not a
        # default to lean on — it is NOT passed here yet; state it explicitly
        # when the UML compile lane is meant to ship.
        # The Gate 2 net helper (the umnet/passt bionic pair behind the net-
        # supervisor spawner) stages under the stated parameter
        # -Porchestella.uml.netHelperDir=<dir> — the dir's presence IS the
        # staging opt-in (no extra flag; packaging is independent of the
        # compileBridge flag). Like the other machine inputs it is absent on
        # this hosted checkout and NOT passed here this round (stated-
        # parameter mode, decided per round): stageUmlNetHelper records the
        # absence and skips, so the release APK carries no helper. State the
        # dir on the packaging machine when the net supervisor is meant to
        # ship; a compileBridge-on build without it answers SPAWN_FAILED
        # (uml-net-helper missing) honestly rather than faking a routable face.
        run: ./gradlew :app:assembleRelease -Porchestella.assets.allowMissingPayload=true -Porchestella.acceleratorLane=true -Porchestella.uml.bundledFastProfile=true -Porchestella.uml.fastProfile=true --no-daemon --stacktrace

      - name: Locate release APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify release APK 16 KB ELF segments and zipalign
        run: bash tools/ci/check-apk-16kb.sh "$APK_PATH"

      - name: Verify release identity, certificate and checksum
        run: |
          python3 tools/release/verify_apk.py \
            --apk "$APK_PATH" \
            --expected-application-id io.github.nyzeep.orchestella \
            --expected-version-name "$VERSION_NAME" \
            --json release-verification.json

      - name: Verify license, NOTICE and source-offer bundle
        run: python3 tools/release/check_licenses.py

      - name: Guard against sensitive developer data
        run: |
          python3 tools/ci/check_sensitive_data.py --self-test
          python3 tools/ci/check_sensitive_data.py

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp "$APK_PATH" "release-bundle/Orchestella-Studio-v${VERSION_NAME}-release.apk"
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path(".")
          output = pathlib.Path("release-bundle")
          manifest = json.loads((root / "tools/release/release_bundle_manifest.json").read_text(encoding="utf-8"))
          for relative in manifest["files"]:
              source = root / relative
              if not source.is_file():
                  raise SystemExit("missing release bundle file: " + relative)
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY
          (cd release-bundle && sha256sum *.apk > SHA256SUMS)
          cat release-bundle/SHA256SUMS

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchestella-release-candidate
          path: |
            release-bundle/
            release-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$HOME/.gradle/gradle.properties"

  # Draft-only publication. Nothing here can make a release public: the CLI is
  # invoked with --draft, the notes file must already exist in the tree, and the
  # job needs an explicit publish=yes on top of a verified build. The accelerator
  # extension APK is NOT built here (it needs the real pVM staging inputs, which
  # hosted CI does not have); attach it to the same draft by hand after the
  # packaging machine produces and verifies it.
  publish-draft:
    name: Create draft GitHub Release
    needs: build-release
    if: ${{ inputs.confirm == 'yes' && inputs.publish == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: orchestella-release-candidate
          path: release-bundle

      - name: Require a release notes file in the tree
        run: |
          NOTES="docs/reports/releases/v${VERSION_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::missing release notes: $NOTES (draft the notes before publishing)"
            exit 1
          fi

      # session 26: 0.6.0 shipped without the QEMU payload (it is gitignored, so a clean
      # checkout builds an APK that installs and then reports "Linux 实例不可用").
      # Refuse to draft a release from such a bundle.
      - name: Require the QEMU runtime payload in the APK
        run: |
          set -euo pipefail
          APK=$(ls release-bundle/*.apk | head -1)
          if ! python3 tools/release/check_runtime_payload.py --apk "$APK"; then
            echo "::error::the bundle APK cannot boot a Linux instance (QEMU payload missing). \
          Build the release on the packaging machine that has the payload, or restore \
          app/src/main/jniLibs/arm64-v8a/{libdroidlayer_qemu,libgvproxy}.so and rebuild."
            exit 1
          fi

      # ACR 2026-11-12 D1/D4, review P2-1 closure: a build that staged the UML
      # fast profile ships assets/uml-fast-profile-v1.sha256, and every digest
      # it accounts for must match the shipped .so bytes. An APK without the
      # manifest is the honest-degradation shape (flag-off, or the sanctioned
      # hosted exemption — the runtime answers MISSING_ASSET at width 0), so
      # the gate SKIPs there instead of refusing; the packaging machine, which
      # knows it passed -Porchestella.uml.fastProfileDir, asserts positively
      # with --require-payload (see docs/reports/tickets/uml-fast-profile-packaging/).
      - name: Verify the UML fast-profile payload accounting in the APK
        run: |
          set -euo pipefail
          APK=$(ls release-bundle/*.apk | head -1)
          if ! python3 tools/release/check_uml_payload.py --apk "$APK"; then
            echo "::error::the bundle APK's UML fast-profile payload does not match its \
          in-APK accounting manifest (assets/uml-fast-profile-v1.sha256). Rebuild on the \
          packaging machine with -Porchestella.uml.fastProfileDir=<pinned U1 artifacts>, \
          or build without the UML flags; shipped bytes and manifest must agree."
            exit 1
          fi

      - name: Create the draft release with the main APK and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="docs/reports/releases/v${VERSION_NAME}.md"
          gh release create "v${VERSION_NAME}" \
            --draft \
            --title "Orchestella Studio v${VERSION_NAME}" \
            --notes-file "$NOTES" \
            release-bundle/*.apk \
            release-bundle/SHA256SUMS
          echo "::notice::Draft created. Attach the verified accelerator extension APK to the same draft before publishing."
