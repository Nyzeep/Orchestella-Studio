name: Rust VT bench (reproducibility + allocation gate)

# Zero-device gate for research/rust-vt-bench. The Rust VT prototype is a frozen
# research snapshot: this job regenerates the five fixtures from scratch, checks
# them against the pinned checksums, rebuilds the bench on the pinned toolchain
# and fails when the median allocation per MB regresses by more than 10% against
# out/alloc_baseline.json. Throughput is printed as an advisory delta only: two
# runs of the same binary on one x86_64 host differed by 1.5x, so it is not
# comparable across machines or runs. No adb, no device, no Android SDK, no
# secrets.
on:
  push:
    paths:
      - "research/rust-vt-bench/**"
      - ".github/workflows/rust-vt.yml"
  pull_request:
    paths:
      - "research/rust-vt-bench/**"
      - ".github/workflows/rust-vt.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Reproduce fixtures, bench and allocation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/rust-vt-bench

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Rust 1.91.0
        run: |
          rustup toolchain install 1.91.0 --profile minimal --no-self-update
          rustup default 1.91.0
          rustc --version

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            research/rust-vt-bench/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('research/rust-vt-bench/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install PyYAML for the workflow parse test
        run: python3 -m pip install --quiet pyyaml==6.0.2

      # Runs before the bench on purpose: the table test compares a fresh render
      # against the committed out/compare.md, which the bench step overwrites.
      - name: Run the offline comparator and workflow tests
        run: python3 -B -m unittest discover -v

      - name: Run cargo tests
        run: cargo test --release --workspace

      - name: Generate deterministic fixtures
        run: python3 fixtures/gen.py

      - name: Verify fixtures against the generated manifest
        run: python3 fixtures/gen.py --verify

      - name: Verify fixture checksums
        run: |
          ( cd fixtures/generated && sha256sum -c SHA256SUMS )
          ( cd fixtures/generated && sha256sum -c ../expected-sha256.txt )

      - name: Run the Rust bench
        run: cargo run --release -p vt-bench -- bench all --out out/rust.json

      - name: Compare against the Kotlin baseline and gate allocations
        run: python3 compare.py --baseline out/alloc_baseline.json
