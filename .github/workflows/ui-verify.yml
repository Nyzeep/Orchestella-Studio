name: UI verify

# Zero-device visual gate for the Compose UI migration (ticket UI3-11).
# Runs the JVM screenshot baselines, the semantics/structure gates and Lint on
# every UI pull request. The screenshot comparison is the only step that can
# fail on a pixel change; diffs are uploaded when it does.

on:
  pull_request:
    branches: [main, "ui3/**"]
  push:
    branches: [main, "ui3/**"]
    paths:
      - "app/src/main/java/io/github/nyzeep/orchestella/ui/**"
      - "app/src/main/java/io/github/nyzeep/orchestella/*.kt"
      - "app/src/main/java/io/github/nyzeep/orchestella/*Presenter*.java"
      - "app/src/main/java/io/github/nyzeep/orchestella/*Activity*.java"
      - "app/src/main/res/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "tools/ci/check_motion_literals.py"
      - ".github/workflows/ui-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ui-verify:
    name: Screenshot, semantics & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Record JDK 17 toolchain path
        run: echo "JDK17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # Gradle runs on 21 as the ticket requires; the runtime modules pin a 17
      # toolchain, so that installation is registered explicitly below.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses & install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            sdk_ok=0
            for attempt in 1 2 3; do
              if "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0"; then
                sdk_ok=1
                break
              fi
              echo "::warning::sdkmanager attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            if [ "$sdk_ok" != 1 ]; then
              echo "::error::sdkmanager could not install platforms;android-36 and build-tools;36.1.0 after 3 attempts"
              exit 1
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # W1-02 (A4-M1/M6): the motion-literal gate joins CI. The scanner is
      # self-contained (stdlib only) and carries its own self-test.
      - name: Motion literal scan and self-test
        run: |
          python tools/ci/check_motion_literals.py --self-test
          python tools/ci/check_motion_literals.py

      # W1-02: token parity against the Specs repo. The token source of truth
      # lives in the private Orchestella-Specs checkout; when a sibling checkout
      # is present this step enforces the parity gate, otherwise it only warns
      # and the authoritative run happens in the Specs repo's own workflow.
      - name: Token parity gate (when sibling Specs checkout exists)
        run: |
          for specs_dir in "../Orchestella-Specs" "../Orchestella_spec" "Orchestella-Specs" "Orchestella_spec"; do
            if [ -f "$specs_dir/docs/design-system/tools/check_tokens.py" ]; then
              python "$specs_dir/docs/design-system/tools/check_tokens.py" \
                --kotlin-root "app/src/main/java/io/github/nyzeep/orchestella/ui" \
                --tokens "$specs_dir/docs/design-system/tokens/oe3.tokens.json"
              exit 0
            fi
          done
          echo "::warning::No sibling Orchestella-Specs checkout; token parity gate deferred to the Specs repo workflow."

      # The Aliyun mirror also covers Robolectric's out-of-band
      # android-all-instrumented download, which is rate-limited on Maven
      # Central from shared runners.
      # Roborazzi's verify property changes how pixel probes capture their temporary images.
      - name: Unit tests and pixel probes
        run: >-
          ./gradlew :app:testDebugUnitTest
          -Porg.gradle.java.installations.paths="$JDK17_HOME"
          -Porchestella.assets.allowMissingPayload=true
          -Porchestella.repositories.useAliyunMirror=true
          --no-daemon --stacktrace

      - name: Verify screenshot baselines and Lint
        run: >-
          ./gradlew :app:verifyRoborazziDebug :app:lintDebug
          -Porg.gradle.java.installations.paths="$JDK17_HOME"
          -Porchestella.assets.allowMissingPayload=true
          -Porchestella.repositories.useAliyunMirror=true
          --no-daemon --stacktrace

      - name: Upload screenshot diffs and reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-verify-failure
          path: |
            app/build/outputs/roborazzi
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
