name: UI verify

# Zero-device visual gate for the Compose UI migration (ticket UI3-11).
# Runs the JVM screenshot baselines, the semantics/structure gates and Lint on
# every UI pull request. The screenshot comparison is the only step that can
# fail on a pixel change; diffs are uploaded when it does.

on:
  pull_request:
    branches: [main, "ui3/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ui-verify:
    name: Screenshot, semantics & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Record JDK 17 toolchain path
        run: echo "JDK17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # Gradle runs on 21 as the ticket requires; the runtime modules pin a 17
      # toolchain, so that installation is registered explicitly below.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses & install components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            sdk_ok=0
            for attempt in 1 2 3; do
              if "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0"; then
                sdk_ok=1
                break
              fi
              echo "::warning::sdkmanager attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            if [ "$sdk_ok" != 1 ]; then
              echo "::error::sdkmanager could not install platforms;android-36 and build-tools;36.1.0 after 3 attempts"
              exit 1
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The Aliyun mirror also covers Robolectric's out-of-band
      # android-all-instrumented download, which is rate-limited on Maven
      # Central from shared runners.
      - name: Unit tests, screenshot verify and Lint
        run: >-
          ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug
          -Porg.gradle.java.installations.paths="$JDK17_HOME"
          -Porchestella.assets.allowMissingPayload=true
          -Porchestella.repositories.useAliyunMirror=true
          --no-daemon --stacktrace

      - name: Upload screenshot diffs and reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-verify-failure
          path: |
            app/build/outputs/roborazzi
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
