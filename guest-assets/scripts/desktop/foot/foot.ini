# DroidLayer foot terminal configuration
# Ultra-fast Wayland terminal with CJK and emoji font fallbacks

[main]
term=xterm-256color
font=monospace:size=11, Noto Sans CJK SC:size=11, Noto Color Emoji:size=11
dpi-aware=yes
pad=8x8

[cursor]
style=block
blink=yes

[colors]
alpha=0.95
background=1e1e2e
foreground=cdd6f4

[csd]
preferred=server
size=28
