# DroidLayer Weston Diagnostic Baseline Configuration

[core]
idle-time=0
require-input=false
xwayland=true

[shell]
locking=false
animation=none
panel-position=top
close-animation=none
focus-animation=none

[keyboard]
keymap_rules=evdev
keymap_layout=us

[launcher]
icon=/usr/share/icons/hicolor/24x24/apps/foot.png
path=/usr/bin/foot
