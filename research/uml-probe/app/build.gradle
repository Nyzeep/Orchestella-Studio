plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.orchestella.umlprobe'
    compileSdk 36

    defaultConfig {
        applicationId "dev.orchestella.umlprobe"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions = ["target"]
    productFlavors {
        sdk36 {
            dimension "target"
            targetSdk 36
        }
        sdk28 {
            dimension "target"
            targetSdk 28
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
