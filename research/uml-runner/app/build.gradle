plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.orchestella.umlrunner'
    compileSdk 36

    defaultConfig {
        applicationId "dev.orchestella.umlrunner"
        minSdk 28
        versionCode 2
        versionName "0.2.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 2026-10-31 UML fabric 设备轮：targetSdk 改为 flavor。
    // sdk36 → targetSdk 36（untrusted_app_34+ 域，本批次 T1/T2/T3/T5 的判定域）。
    // sdk28 → 保持历史行为（untrusted_app_27 类域，10-29 轮的对照基线）。
    // 36 域 exec 约束：只能 exec nativeLibraryDir（apk_data_file），filesDir 的 app_data_file exec 被禁；
    // 内核/stub 全部经 jniLibs 进 nativeLibraryDir，不触碰禁令（10-29 三探针已验证 36 域 mmap/exec 面）。
    flavorDimensions "targetsdk"
    productFlavors {
        sdk36 {
            dimension "targetsdk"
            targetSdk 36
        }
        sdk28 {
            dimension "targetsdk"
            targetSdk 28
        }
    }

    // UML 内核与 stub 以 lib*.so 形式进 nativeLibraryDir。
    // useLegacyPackaging=true → 安装时解包到 nativeLibraryDir（否则 APK 内直读，没有可 exec 的实体文件）。
    // keepDebugSymbols 覆盖 AGP 默认 strip：这两个不是真 .so，被 strip 会破坏内核镜像。
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/libuml_kernel*.so'
            keepDebugSymbols += '**/libuml_stub.so'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
